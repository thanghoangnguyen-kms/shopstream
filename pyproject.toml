[project]
name = "shopstream"
version = "0.0.0"
description = "An enterprise-grade open lakehouse on a laptop: a 23-week data engineering capstone."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = ["shopstream-generator"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "prek==0.5.3",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.16.8",
  "rust-just==1.58.0",
  "sqlfluff==4.3.0",
  "types-pyyaml==6.0.12.20260906",
  "zizmor==1.30.1",
]

[tool.uv]
package = false
required-version = ">=0.12.18"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
shopstream-generator = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
# The formatter owns line length; E501 would only flag long strings it can't wrap.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"packages/*/tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages", "scripts", "tests"]
mypy_path = ["scripts"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
testpaths = ["tests", "packages"]
pythonpath = ["scripts"]
