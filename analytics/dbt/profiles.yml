shopstream:
  target: lk
  outputs:
    lk:
      type: duckdb
      path: ":memory:"
      database: lk
      threads: 1
      extensions: [iceberg, httpfs]
      # Item 8: the dbt build also runs inside the Airflow scheduler, so DuckDB is capped at 512MiB.
      settings:
        memory_limit: "512MiB"
      attach:
        - path: spike
          alias: lk
          type: iceberg
          options:
            endpoint: "http://lakekeeper:8181/catalog"
            authorization_type: none
    ci:
      type: duckdb
      path: ":memory:"
      threads: 1
